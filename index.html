<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Browser</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
    font-family: Arial, sans-serif;
}

.browser {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.address-wrap {
    width: min(700px, 90%);
    display: flex;
    gap: 8px;
}

#url {
    flex: 1;
    height: 42px;
    border: 1px solid #444;
    border-radius: 10px;
    background: #292929;
    color: white;
    padding: 0 15px;
    font-size: 15px;
    outline: none;
}

#url:focus {
    border-color: #4d9cff;
}

button {
    height: 42px;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    background: #2d7ff9;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1769df;
}
</style>
</head>

<body>

<div class="browser">

    <div class="address-wrap">

        <input
            id="url"
            type="text"
            placeholder="URL을 입력하세요. 예: chatgpt.com"
            autocomplete="off"
            spellcheck="false"
        >

        <button onclick="go()">열기</button>

    </div>

</div>

<script>

const urlInput = document.getElementById("url");

function normalizeURL(value) {

    value = value.trim();

    if (!value) {
        return null;
    }

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    try {

        const url = new URL(value);

        if (
            url.protocol !== "http:" &&
            url.protocol !== "https:"
        ) {
            return null;
        }

        return url.href;

    } catch {

        return null;
    }
}

function go() {

    const url = normalizeURL(urlInput.value);

    if (!url) {
        alert("올바른 URL을 입력해주세요.");
        return;
    }

    window.location.href = url;
}

urlInput.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        go();
    }

});

</script>

</body>
</html>
